[package]
name = "sniff-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1.0.151"
arrow = { version = "59.2.0", features = ["ipc", "ipc_compression", "chrono-tz"], optional = true }
parquet = { version = "59.2.0", features = ["arrow"], optional = true }
# No "derive" feature - ColumnProfile's own Serialize impl is hand-written
# (see src/lib.rs) rather than #[derive(Serialize)]; the plain trait is
# still needed for that impl's own `S: serde::Serializer` bound.
serde = "1.0.229"
sas7bdat = { version = "0.8.0", optional = true }

[features]
default = []
# parquet also covers Arrow IPC/Feather (.arrow/.feather) - both are Arrow-ecosystem
# formats sharing the same `arrow` crate, so there's no separate compile cost to split them.
parquet = ["dep:arrow", "dep:parquet"]
xlsx = []
avro = []
full = ["parquet", "xlsx", "avro", "sqlite", "msgpack", "toml", "yaml", "cbor", "ini", "xml", "zstd", "npy", "weblog", "syslog", "dbase", "stata", "sas7bdat"]
sqlite = []
msgpack = []
toml = []
yaml = []
cbor = []
ini = []
xml = []
zstd = []
npy = []
weblog = []
syslog = []
dbase = []
stata = []
sas7bdat = ["dep:sas7bdat"]

[dev-dependencies]
# Dev-only - never affects the shipped binary or a consumer's build, unlike
# every other dependency decision in this file. See CLAUDE.md's benchmarking
# section for why this is the one place this project reaches for a big,
# full-featured crate instead of hand-rolling something leaner.
criterion = { version = "0.8.2", features = ["html_reports"] }
# calamine (and chrono, needed only by calamine's own `as_datetime()` API)
# used to be a real, optional runtime dependency of the `xlsx` feature -
# every format it covers (.xlsx/.ods/.xls/.xlsb) now has its own
# hand-rolled reader instead (see CLAUDE.md's Dependency footprint
# section), so both moved here: kept only as this project's own
# cross-verification oracle in the `*_matches_calamine_output_exactly`
# tests (`#[cfg(all(test, feature = "xlsx"))]` in src/lib.rs), the same
# "dev-only, never touches the shipped binary" treatment criterion above
# already gets.
calamine = { version = "0.36.1", features = ["chrono"] }
chrono = "0.4"
# Same dev-only treatment, same reason: the `ini` feature's own hand-rolled
# reader (`ini_support` in src/lib.rs) replaced this at runtime; kept only
# for the `ini_reader_matches_rust_ini_output_exactly` cross-verification
# test.
rust-ini = "0.21.3"
# Same dev-only treatment, same reason: the `xml` feature's own hand-rolled
# reader (`xml_support` in src/lib.rs) replaced this at runtime; kept only
# for the `xml_reader_matches_xmltree_output_exactly` cross-verification
# test. Same `attribute-order` feature as before, so the comparison isn't
# comparing against an artificially-reordered attribute map.
xmltree = { version = "0.12.0", features = ["attribute-order"] }
# Same dev-only treatment, same reason: the `zstd` feature's own hand-rolled
# decoder (`zstd_support` in src/lib.rs - FSE, Huffman, and the full RFC
# 8878 frame/block/literals/sequences pipeline) replaced this at runtime;
# kept only as this project's own cross-verification oracle in
# `zstd_reader_matches_the_zstd_crate_output_exactly`
# (`#[cfg(all(test, feature = "zstd"))]` in src/lib.rs).
zstd = "0.13.3"
# Same dev-only treatment, same reason: the `npy` feature's own hand-rolled
# reader (`npy_support` in src/lib.rs - the NPY header/dtype format, plus
# `zip_support::ZipArchive` for `.npz`) replaced this at runtime; kept only
# as this project's own cross-verification oracle in
# `npy_reader_matches_the_npyz_crate_output_exactly` and
# `npz_reader_matches_the_npyz_crate_output_exactly`
# (`#[cfg(all(test, feature = "npy"))]` in src/lib.rs). The `npz` feature
# is still needed here (unlike at runtime) purely for the oracle's own use
# of `npyz::npz::NpzArchive`.
npyz = { version = "0.9.1", features = ["npz"] }
# Same dev-only treatment, same reason: the `msgpack` feature's own hand-
# rolled decoder (`msgpack_support` in src/lib.rs) replaced it at runtime;
# kept only as this project's own cross-verification oracle in
# `msgpack_reader_matches_the_rmpv_crate_output_exactly`
# (`#[cfg(all(test, feature = "msgpack"))]` in src/lib.rs).
rmpv = "1.3.1"
# Same dev-only treatment, same reason: the `toml` feature's own hand-
# rolled parser (`toml_support` in src/lib.rs) replaced it at runtime;
# kept only as this project's own cross-verification oracle in
# `toml_reader_matches_the_toml_crate_output_exactly`
# (`#[cfg(all(test, feature = "toml"))]` in src/lib.rs).
toml = "1.1.4"
# Same dev-only treatment, same reason: the `cbor` feature's own hand-
# rolled decoder (`cbor_support` in src/lib.rs) replaced it at runtime;
# kept only as this project's own cross-verification oracle in
# `cbor_reader_matches_the_ciborium_crate_output_exactly`
# (`#[cfg(all(test, feature = "cbor"))]` in src/lib.rs).
ciborium = "0.2.2"
# Same dev-only treatment, same reason: the `weblog` and `syslog` features'
# own hand-rolled line parsers (`weblog_support`/`syslog_support` in
# src/lib.rs) replaced this at runtime; kept only as this project's own
# cross-verification oracle in
# `weblog_reader_matches_the_regex_crate_output_exactly` and
# `syslog_reader_matches_the_regex_crate_output_exactly`
# (`#[cfg(all(test, feature = "weblog"))]`/`#[cfg(all(test, feature =
# "syslog"))]` in src/lib.rs).
regex = "1.13.1"
# Same dev-only treatment, same reason: the `dbase` feature's own hand-
# rolled reader (`dbase_support` in src/lib.rs) replaced it at runtime;
# kept only as this project's own cross-verification oracle in
# `dbase_reader_matches_the_dbase_crate_output_exactly`
# (`#[cfg(all(test, feature = "dbase"))]` in src/lib.rs).
dbase = "0.8.0"
# Same dev-only treatment, same reason: the `stata` feature's own hand-
# rolled reader (`stata_support` in src/lib.rs) replaced it at runtime;
# kept only as this project's own cross-verification oracle in
# `stata_reader_matches_the_dta_crate_output_exactly`
# (`#[cfg(all(test, feature = "stata"))]` in src/lib.rs).
dta = "0.6.0"
# Same dev-only treatment, same reason: the `avro` feature's own hand-
# rolled reader (`avro_support` in src/lib.rs - schema parsing, binary
# decoding, and its own Deflate/Snappy/Zstandard codec integration, the
# latter two reusing `inflate`/`zstd_support` rather than duplicating
# them) replaced this at runtime; kept only as this project's own
# cross-verification oracle in
# `avro_reader_matches_the_apache_avro_crate_output_exactly`
# (`#[cfg(all(test, feature = "avro"))]` in src/lib.rs). `num-bigint`
# moves with it - it was only ever depended on directly to decode
# apache-avro's own `Decimal` value type (see that oracle's own
# `avro_decimal_to_string_via_apache_avro_crate`), which no longer runs
# outside tests.
apache-avro = { version = "0.22.0", features = ["snappy", "zstandard"] }
num-bigint = "0.4"
# Same dev-only treatment, same reason: the `sqlite` feature's own hand-
# rolled reader (`sqlite_support` in src/lib.rs - direct B-tree page
# traversal, record decoding, and a small CREATE-TABLE-column-name
# parser) replaced this at runtime; kept only as this project's own
# cross-verification oracle in
# `sqlite_reader_matches_the_rusqlite_crate_output_exactly`
# (`#[cfg(all(test, feature = "sqlite"))]` in src/lib.rs). Unlike every
# other crate in this list, `rusqlite` was never a Rust reimplementation
# of its format to begin with - it's an FFI binding over the real, linked
# SQLite C library - so it still serves as a genuine independent oracle
# (a different codebase entirely, not just a different Rust parser).
rusqlite = { version = "0.40.2", features = ["bundled"] }

# harness = false on every target below: Criterion supplies its own `main`,
# replacing the default libtest harness (which doesn't understand
# Criterion's `criterion_group!`/`criterion_main!` macros).
[[bench]]
name = "heuristic_engine"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "format_comparison"
harness = false
required-features = ["parquet", "sqlite", "xlsx"]
