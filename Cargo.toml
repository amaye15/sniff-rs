[package]
name = "sniff-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1.0.151"
arrow = { version = "59.2.0", features = ["ipc", "ipc_compression"], optional = true }
parquet = { version = "59.2.0", features = ["arrow"], optional = true }
calamine = { version = "0.36.1", optional = true }
apache-avro = { version = "0.22.0", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
rmpv = { version = "1.3.1", optional = true }
toml = { version = "1.1.4", optional = true }
serde_norway = { version = "0.9.42", optional = true }

[features]
default = []
# parquet also covers Arrow IPC/Feather (.arrow/.feather) - both are Arrow-ecosystem
# formats sharing the same `arrow` crate, so there's no separate compile cost to split them.
parquet = ["dep:arrow", "dep:parquet"]
xlsx = ["dep:calamine"]
avro = ["dep:apache-avro"]
full = ["parquet", "xlsx", "avro", "sqlite", "msgpack", "toml", "yaml"]
sqlite = ["dep:rusqlite"]
msgpack = ["dep:rmpv"]
toml = ["dep:toml"]
# serde_norway is a maintained fork of the archived serde_yaml (same API
# shape) - see CLAUDE.md's Known limitations for why serde_yaml itself was
# passed over.
yaml = ["dep:serde_norway"]
