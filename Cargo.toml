[package]
name = "sniff-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1.0.151"
arrow = { version = "59.2.0", features = ["ipc", "ipc_compression", "chrono-tz"], optional = true }
parquet = { version = "59.2.0", features = ["arrow"], optional = true }
calamine = { version = "0.36.1", features = ["chrono"], optional = true }
apache-avro = { version = "0.22.0", features = ["snappy", "zstandard"], optional = true }
# Already a transitive dependency of apache-avro itself (its Decimal value
# type wraps a num_bigint::BigInt internally) - depending on it directly
# too adds zero new crates to the build, just exposes a type that's
# already being compiled whenever --features avro is on.
num-bigint = { version = "0.4", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
rmpv = { version = "1.3.1", optional = true }
toml = { version = "1.1.4", optional = true }
serde_norway = { version = "0.9.42", optional = true }
ciborium = { version = "0.2.2", optional = true }
rust-ini = { version = "0.21.3", optional = true }
xmltree = { version = "0.12.0", features = ["attribute-order"], optional = true }
flate2 = "1.1.9"
tempfile = "3.27.0"
zstd = { version = "0.13.3", optional = true }
npyz = { version = "0.9.1", features = ["npz"], optional = true }
regex = { version = "1.13.1", optional = true }
dbase = { version = "0.8.0", optional = true }
dta = { version = "0.6.0", optional = true }
sas7bdat = { version = "0.8.0", optional = true }

[features]
default = []
# parquet also covers Arrow IPC/Feather (.arrow/.feather) - both are Arrow-ecosystem
# formats sharing the same `arrow` crate, so there's no separate compile cost to split them.
parquet = ["dep:arrow", "dep:parquet"]
xlsx = ["dep:calamine"]
avro = ["dep:apache-avro", "dep:num-bigint"]
full = ["parquet", "xlsx", "avro", "sqlite", "msgpack", "toml", "yaml", "cbor", "ini", "xml", "zstd", "npy", "weblog", "syslog", "dbase", "stata", "sas7bdat"]
sqlite = ["dep:rusqlite"]
msgpack = ["dep:rmpv"]
toml = ["dep:toml"]
# serde_norway is a maintained fork of the archived serde_yaml (same API
# shape) - see CLAUDE.md's Known limitations for why serde_yaml itself was
# passed over.
yaml = ["dep:serde_norway"]
cbor = ["dep:ciborium"]
ini = ["dep:rust-ini"]
xml = ["dep:xmltree"]
zstd = ["dep:zstd"]
npy = ["dep:npyz"]
weblog = ["dep:regex"]
syslog = ["dep:regex"]
dbase = ["dep:dbase"]
stata = ["dep:dta"]
sas7bdat = ["dep:sas7bdat"]

[dev-dependencies]
# Dev-only - never affects the shipped binary or a consumer's build, unlike
# every other dependency decision in this file. See CLAUDE.md's benchmarking
# section for why this is the one place this project reaches for a big,
# full-featured crate instead of hand-rolling something leaner.
criterion = { version = "0.8.2", features = ["html_reports"] }

# harness = false on every target below: Criterion supplies its own `main`,
# replacing the default libtest harness (which doesn't understand
# Criterion's `criterion_group!`/`criterion_main!` macros).
[[bench]]
name = "heuristic_engine"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "format_comparison"
harness = false
required-features = ["parquet", "sqlite", "xlsx"]
